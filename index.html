<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a4fa8">
<title>كاشف المقام</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root {
  /* One screen: name, one big round record button, the answer underneath. */
  --bg: #eceff4; --surface: #f8f9fc; --fg: #14213a; --muted: #56627a; --line: #d3d9e6;
  --accent: #2a4fa8; --accent-fg: #ffffff; --gold: #9a6200; --gold-soft: #efe1bd; --rec: #b3261e;
  --display: 'Aref Ruqaa', 'Noto Naskh Arabic', serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1322; --surface: #151d31; --fg: #e7ecf7; --muted: #93a0bb; --line: #26314a;
    --accent: #86a8ff; --accent-fg: #0d1322; --gold: #e3b45a; --gold-soft: #3a3020; --rec: #ff8a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body);
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
main { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
h1 { font: 700 34px/1.2 var(--display); color: var(--accent); margin: 8px 0 0; }
.sub { margin: -14px 0 0; color: var(--muted); font-size: 15px; }

.rec {
  width: 168px; height: 168px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--accent-fg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font: 600 18px/1.2 var(--body); box-shadow: 0 10px 30px -12px var(--accent);
  -webkit-tap-highlight-color: transparent;
}
.rec svg { width: 46px; height: 46px; }
.rec.on { background: var(--rec); box-shadow: 0 0 0 0 var(--rec); animation: pulse 1.4s infinite; }
.rec:disabled { opacity: .55; cursor: default; }
.rec:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(179,38,30,.45); } 100% { box-shadow: 0 0 0 26px rgba(179,38,30,0); } }
@media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }

.status { min-height: 52px; color: var(--muted); font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.time { font: 600 22px/1 var(--body); color: var(--fg); font-variant-numeric: tabular-nums; direction: ltr; }
.meter { width: 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }

.result { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 20px; }
.label { color: var(--muted); font-size: 14px; margin: 0; }
.name { font: 700 clamp(64px, 22vw, 96px)/1.15 var(--display); color: var(--accent); margin: 4px 0; }
.tonic { font-size: 18px; font-weight: 600; margin: 0; }
.also { margin: 10px 0 0; color: var(--gold); font-size: 15px; font-weight: 600; }
.small { margin-top: 14px; font: 600 15px var(--body); color: var(--accent); background: transparent; border: 1.5px solid var(--accent); border-radius: 12px; padding: 9px 16px; cursor: pointer; }
.small:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.err { width: 100%; background: var(--gold-soft); color: var(--fg); border-radius: 14px; padding: 12px 14px; margin: 0; }

.file { margin-top: auto; font-size: 14px; color: var(--muted); }
.file label { color: var(--accent); text-decoration: underline; cursor: pointer; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.tip { font-size: 13px; color: var(--muted); margin: 0; max-width: 34ch; }
</style>
</head>
<body>
<main>
  <h1>كاشف المقام</h1>
  <p class="sub">اضغط، غنِّ 20 ثانية، واضغط مرة ثانية</p>

  <button class="rec" id="rec" type="button" aria-label="سجّل">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <span id="recLabel">سجّل</span>
  </button>

  <div class="status" id="status" aria-live="polite"></div>
  <section id="out" aria-live="polite"></section>

  <p class="tip">الأدق: صوتك لوحده، قريب من الموبايل، بدون موسيقى في الخلفية.</p>
  <p class="file">أو <label for="file">اختر ملفًا صوتيًا</label><input id="file" type="file" accept="audio/*,video/*"></p>
</main>

<script>
'use strict';
/* Maqam detection core: pitch tracking (YIN), pitch-class histogram, template matching. */

const BINS = 120; // 10-cent bins over one octave

// Scale degrees in quarter-tone units (1 unit = 50 cents) above the tonic.
const MAQAMAT = [
  { id: 'rast',      ar: 'راست',     deg: [0, 4, 7, 10, 14, 18, 21] },
  { id: 'bayati',    ar: 'بياتي',    deg: [0, 3, 6, 10, 14, 16, 20] },
  { id: 'hijaz',     ar: 'حجاز',     deg: [0, 2, 8, 10, 14, 16, 20] },
  { id: 'saba',      ar: 'صبا',      deg: [0, 3, 6, 8, 14, 16, 20] },
  { id: 'nahawand',  ar: 'نهاوند',   deg: [0, 4, 6, 10, 14, 16, 20, 22], w: [1, 1, 1, 1, 1, 1, 0.5, 0.7] },
  { id: 'kurd',      ar: 'كرد',      deg: [0, 2, 6, 10, 14, 16, 20] },
  { id: 'ajam',      ar: 'عجم',      deg: [0, 4, 8, 10, 14, 18, 22] },
  { id: 'sika',      ar: 'سيكا',     deg: [0, 3, 7, 11, 14, 17, 21] },
  { id: 'nikriz',    ar: 'نكريز',    deg: [0, 4, 6, 12, 14, 18, 20] },
  { id: 'suznak',    ar: 'سوزناك',   deg: [0, 4, 7, 10, 14, 16, 22] },
  { id: 'hijazkar',  ar: 'حجاز كار', deg: [0, 2, 8, 10, 14, 16, 22] },
  { id: 'nawaathar', ar: 'نوا أثر',  deg: [0, 4, 6, 12, 14, 16, 22] },
];

const EVEN_NAMES = { 0: 'دو', 2: 'ري♭', 4: 'ري', 6: 'مي♭', 8: 'مي', 10: 'فا', 12: 'فا♯', 14: 'صول', 16: 'لا♭', 18: 'لا', 20: 'سي♭', 22: 'سي' };
const UPPER_NATURAL = { 3: 1, 7: 1, 9: 1, 13: 1, 17: 1, 21: 1 };

function unitName(u) {
  u = ((u % 24) + 24) % 24;
  if (u % 2 === 0) return EVEN_NAMES[u];
  if (UPPER_NATURAL[u]) return EVEN_NAMES[u + 1] + ' نصف♭';
  return EVEN_NAMES[u - 1] + ' نصف♯';
}

// cents measured from A440 -> { name, dev } nearest 24-EDO name from C
function noteFromCents(c) {
  const u = (c + 900) / 50;
  const r = Math.round(u);
  return { name: unitName(r), dev: (u - r) * 50 };
}

function fracTone(u) {
  const w = Math.floor(u / 4), r = u % 4;
  const f = ['', '¼', '½', '¾'][r];
  const s = (w ? String(w) : '') + f;
  return s || '0';
}

function stepsOf(deg) {
  const out = [];
  for (let i = 0; i < deg.length; i++) {
    const next = i + 1 < deg.length ? deg[i + 1] : 24;
    out.push(fracTone(next - deg[i]));
  }
  return out;
}

function cycDist(a, b) {
  const d = Math.abs(a - b) % BINS;
  return Math.min(d, BINS - d);
}

function window5(H) {
  const W = new Float64Array(BINS);
  for (let i = 0; i < BINS; i++) {
    let s = 0;
    for (let k = -2; k <= 2; k++) s += H[(i + k + BINS) % BINS];
    W[i] = s;
  }
  return W;
}

function argmax(a) {
  let bi = 0;
  for (let i = 1; i < a.length; i++) if (a[i] > a[bi]) bi = i;
  return bi;
}

function tick() { return new Promise((r) => setTimeout(r, 0)); }

/* x: mono Float32Array, sr: sample rate. Returns { H, Hfinal, stats } or throws Error('no_pitch'). */
async function analyze(x, sr, onProgress) {
  const f = Math.max(1, Math.round(sr / 16000));
  const fs = sr / f;
  const n = Math.floor(x.length / f);
  const y = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let j = 0; j < f; j++) s += x[i * f + j];
    y[i] = s / f;
  }
  const W = 768, hop = 512;
  const tauMax = Math.floor(fs / 65), tauMin = Math.max(2, Math.floor(fs / 1000));
  const nFrames = Math.floor((n - W - tauMax) / hop);
  if (nFrames < 20) throw new Error('too_short');

  const rms = new Float32Array(nFrames);
  for (let i = 0; i < nFrames; i++) {
    let s = 0; const o = i * hop;
    for (let j = 0; j < W; j++) s += y[o + j] * y[o + j];
    rms[i] = Math.sqrt(s / W);
  }
  const sorted = Array.from(rms).sort((a, b) => a - b);
  const p90 = sorted[Math.floor(sorted.length * 0.9)];
  const gate = Math.max(1e-4, 0.15 * p90);

  const d = new Float32Array(tauMax + 2), cm = new Float32Array(tauMax + 2);
  const cents = new Float32Array(nFrames).fill(NaN);
  const conf = new Float32Array(nFrames);

  for (let i = 0; i < nFrames; i++) {
    if (i % 150 === 0) {
      if (onProgress) onProgress(i / nFrames);
      await tick();
    }
    if (rms[i] < gate) continue;
    const o = i * hop;
    for (let tau = 1; tau <= tauMax; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) { const df = y[o + j] - y[o + j + tau]; s += df * df; }
      d[tau] = s;
    }
    cm[0] = 1;
    let run = 0;
    for (let tau = 1; tau <= tauMax; tau++) { run += d[tau]; cm[tau] = run > 0 ? (d[tau] * tau) / run : 1; }
    let tau = -1;
    for (let t = tauMin; t < tauMax; t++) {
      if (cm[t] < 0.15) {
        while (t + 1 < tauMax && cm[t + 1] < cm[t]) t++;
        tau = t; break;
      }
    }
    if (tau < 0) continue;
    let tf = tau;
    if (tau > 1 && tau < tauMax) {
      const a = cm[tau - 1], b = cm[tau], c = cm[tau + 1];
      const den = a - 2 * b + c;
      if (den !== 0) tf = tau + (a - c) / (2 * den);
    }
    const freq = fs / tf;
    if (freq < 65 || freq > 1000) continue;
    cents[i] = 1200 * Math.log2(freq / 440);
    conf[i] = 1 - cm[tau];
  }
  if (onProgress) onProgress(1);

  // keep only steady pitches (drop glides and note boundaries)
  const H = new Float64Array(BINS);
  const stableIdx = [];
  let total = 0;
  for (let i = 1; i < nFrames - 1; i++) {
    const c = cents[i];
    if (Number.isNaN(c) || Number.isNaN(cents[i - 1]) || Number.isNaN(cents[i + 1])) continue;
    if (Math.abs(c - cents[i - 1]) > 35 || Math.abs(c - cents[i + 1]) > 35) continue;
    const m = ((c % 1200) + 1200) % 1200;
    H[Math.floor(m / 10) % BINS] += 1;
    total += 1;
    stableIdx.push(i);
  }
  if (total < 40) { const er = new Error('no_pitch'); er.track = { cents, nFrames, hopSec: hop / fs, t0: (W / 2) / fs }; throw er; }
  for (let i = 0; i < BINS; i++) H[i] /= total;

  const Hfinal = new Float64Array(BINS);
  const tail = stableIdx.slice(-60);
  for (const i of tail) {
    const m = ((cents[i] % 1200) + 1200) % 1200;
    Hfinal[Math.floor(m / 10) % BINS] += 1 / tail.length;
  }
  return {
    H, Hfinal, monoTrack: { cents, nFrames, hopSec: hop / fs, t0: (W / 2) / fs },
    track: { cents, stableIdx: Int32Array.from(stableIdx), nFrames, hopSec: hop / fs, t0: (W / 2) / fs },
    stats: { frames: nFrames, stable: total, seconds: (n / fs) },
  };
}

/* ---------- phrase segmentation: find where the maqam changes ---------- */
function lowerBound(arr, v) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; }
  return lo;
}

function histOf(cents, S, lo, hi, finalN) {
  const H = new Float64Array(BINS), Hf = new Float64Array(BINS);
  const n = hi - lo;
  for (let k = lo; k < hi; k++) {
    const m = ((cents[S[k]] % 1200) + 1200) % 1200;
    H[Math.floor(m / 10) % BINS] += 1 / n;
  }
  const fl = Math.max(lo, hi - (finalN || 40)), nf = hi - fl;
  for (let k = fl; k < hi; k++) {
    const m = ((cents[S[k]] % 1200) + 1200) % 1200;
    Hf[Math.floor(m / 10) % BINS] += 1 / nf;
  }
  return { H, Hfinal: Hf };
}

function centsDist(a, b) {
  const d = Math.abs(a - b) % 1200;
  return Math.min(d, 1200 - d);
}

/* Phrase segmentation. Each steady note is assigned to a quarter-tone slot on the piece's own tuning grid.
   A Viterbi pass picks, for every moment, the pitch set that explains the notes best, paying a fixed cost
   for every switch so brief wanderings do not count as a modulation. Returns
   [{start, end, maqam, tonicCents, score}] with times in seconds. */
function segmentTimeline(res, globalTop, opts) {
  let penalty = (opts && opts.penalty) || 10;
  const minSeg = (opts && opts.minSeconds) || 8;
  const tr = res.track, S = tr.stableIdx, cents = tr.cents, hop = tr.hopSec;
  const T = S.length;
  if (T < 60) return [];
  const timeOfObs = (k) => (tr.times ? tr.times[S[k]] : tr.t0 + S[k] * hop);
  if (tr.times) { const span = Math.max(1, timeOfObs(T - 1) - timeOfObs(0)); penalty *= Math.max(1, (T / span) / 15); }
  const finalN = tr.finalN || 40;
  const anchor = globalTop.tonicCents;
  const unitRel = (c) => Math.round(((((c - anchor) % 1200) + 1200) % 1200) / 50) % 24;
  const U = new Uint8Array(T);
  for (let k = 0; k < T; k++) U[k] = unitRel(cents[S[k]]);

  // hypotheses = distinct pitch sets (a maqam and the one sharing its notes from another tonic are one set here)
  const states = [], seen = {};
  for (const m of MAQAMAT) {
    for (let tu = 0; tu < 24; tu++) {
      const set = Array.from(new Set(m.deg.map((d) => (tu + d) % 24))).sort((x, y) => x - y);
      const key = set.join(',');
      if (seen[key]) continue;
      seen[key] = 1;
      states.push(set);
    }
  }
  const N = states.length;
  const E = new Float64Array(N * 24);
  for (let s = 0; s < N; s++) {
    const inSet = new Uint8Array(24);
    states[s].forEach((u) => { inSet[u] = 1; });
    const sz = states[s].length;
    const lin = Math.log(0.88 / sz), lout = Math.log(0.12 / (24 - sz));
    for (let u = 0; u < 24; u++) E[s * 24 + u] = inSet[u] ? lin : lout;
  }

  let delta = new Float64Array(N), nd = new Float64Array(N);
  for (let s = 0; s < N; s++) delta[s] = E[s * 24 + U[0]];
  const sw = new Uint8Array(T * N), bestPrev = new Int16Array(T);
  for (let t = 1; t < T; t++) {
    let pb = -Infinity, pa = 0;
    for (let s = 0; s < N; s++) if (delta[s] > pb) { pb = delta[s]; pa = s; }
    bestPrev[t - 1] = pa;
    const sc = pb - penalty, u = U[t];
    for (let s = 0; s < N; s++) {
      const stay = delta[s];
      if (stay >= sc) { nd[s] = stay + E[s * 24 + u]; } else { nd[s] = sc + E[s * 24 + u]; sw[t * N + s] = 1; }
    }
    const tmp = delta; delta = nd; nd = tmp;
  }
  let cur = 0;
  for (let s = 1; s < N; s++) if (delta[s] > delta[cur]) cur = s;
  const path = new Int16Array(T);
  for (let t = T - 1; t >= 0; t--) {
    path[t] = cur;
    if (t > 0 && sw[t * N + cur]) cur = bestPrev[t - 1];
  }

  // runs of one hypothesis, as ranges of steady-note indices
  const timeAt = timeOfObs;
  let runs = [];
  for (let k = 0; k < T; k++) {
    if (runs.length && runs[runs.length - 1].s === path[k]) runs[runs.length - 1].b = k + 1;
    else runs.push({ s: path[k], a: k, b: k + 1 });
  }
  const dur = (r) => timeAt(r.b - 1) - timeAt(r.a);
  for (let guard = 0; guard < 200 && runs.length > 1; guard++) {
    const j = runs.findIndex((r) => dur(r) < minSeg);
    if (j < 0) break;
    const nb = j > 0 ? runs[j - 1] : runs[j + 1];
    if (j > 0) { nb.b = runs[j].b; runs.splice(j, 1); }
    else { nb.a = runs[j].a; runs.splice(j, 1); }
    const merged = [];
    runs.forEach((r) => { const p = merged[merged.length - 1]; if (p && p.s === r.s) p.b = r.b; else merged.push(r); });
    runs = merged;
  }

  // name every phrase from its own notes; a boundary sits between the last note of one and the first of the next
  const segs = runs.map((r, i) => {
    const top = rank(histOf(cents, S, r.a, r.b, finalN))[0];
    const start = i === 0 ? timeAt(r.a) : (timeAt(r.a - 1) + timeAt(r.a)) / 2;
    const end = i === runs.length - 1 ? timeAt(r.b - 1) : (timeAt(r.b - 1) + timeAt(r.b)) / 2;
    return { start, end, maqam: top.maqam, tonicCents: top.tonicCents, score: top.score };
  });
  const merged = [];
  for (const s of segs) {
    const p = merged[merged.length - 1];
    if (p && p.maqam.id === s.maqam.id && centsDist(p.tonicCents, s.tonicCents) < 35) p.end = s.end;
    else merged.push(Object.assign({}, s));
  }
  return merged;
}

/* Score every maqam at every possible tonic; return best tonic per maqam, sorted. */
function rank(res) {
  const H = res.H;
  const W = window5(H);
  const finalBin = argmax(window5(res.Hfinal));
  const peakBin = argmax(W);
  const out = [];
  for (const m of MAQAMAT) {
    let best = null;
    const D = m.deg.length;
    for (let t = 0; t < BINS; t++) {
      let inTot = 0, pres = 0, ws = 0;
      for (let j = 0; j < D; j++) {
        const w = m.w ? m.w[j] : 1;
        const mass = W[(t + 5 * m.deg[j]) % BINS];
        inTot += mass;
        pres += w * Math.min(1, mass / 0.04);
        ws += w;
      }
      pres /= ws;
      const m0 = W[t];
      const tonicTerm = 0.8 + 0.2 * Math.min(1, m0 / 0.1);
      const base = inTot * (0.55 + 0.45 * pres) * tonicTerm;
      const fin = Math.exp(-Math.pow(cycDist(t, finalBin) / 3, 2));
      const pk = Math.exp(-Math.pow(cycDist(t, peakBin) / 3, 2));
      const score = base + 0.12 * fin + 0.03 * pk;
      if (!best || score > best.score) best = { maqam: m, t, score, inTot, pres, fin };
    }
    // refine tonic pitch (cents from A440) with a weighted mean around the bin
    let sw = 0, so = 0;
    for (let k = -2; k <= 2; k++) { const v = H[(best.t + k + BINS) % BINS]; sw += v; so += v * k; }
    best.tonicCents = ((best.t * 10 + 5 + (sw > 0 ? (so / sw) * 10 : 0)) % 1200 + 1200) % 1200;
    out.push(best);
  }
  out.sort((a, b) => b.score - a.score);
  return out;
}


/* ---------- full-mix analysis: spectral peaks instead of a single tracked pitch ---------- */
function fftInPlace(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const xr = re[b] * cr - im[b] * ci, xi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}

async function analyzePoly(x, sr, onProgress) {
  const f = Math.max(1, Math.round(sr / 16000));
  const fs = sr / f, n = Math.floor(x.length / f);
  const y = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < f; j++) s += x[i * f + j]; y[i] = s / f; }
  const N = 4096, hop = 2048;
  const nFrames = Math.floor((n - N) / hop);
  if (nFrames < 20) throw new Error('too_short');
  const win = new Float64Array(N);
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1));
  const binHz = fs / N, kmin = Math.ceil(90 / binHz), kmax = Math.floor(1100 / binHz);
  const re = new Float64Array(N), im = new Float64Array(N), mag = new Float64Array(N / 2);
  const frames = [];
  for (let fr = 0; fr < nFrames; fr++) {
    if (fr % 60 === 0) { if (onProgress) onProgress(fr / nFrames); await tick(); }
    const o = fr * hop;
    for (let i = 0; i < N; i++) { re[i] = y[o + i] * win[i]; im[i] = 0; }
    fftInPlace(re, im);
    for (let k = 0; k < N / 2; k++) mag[k] = Math.sqrt(re[k] * re[k] + im[k] * im[k]);
    const band = Array.prototype.slice.call(mag, kmin, kmax + 1).sort((a, b) => a - b);
    const med = band[band.length >> 1] || 0;
    const thr = Math.max(4 * med, 1e-6);
    const cand = [];
    for (let k = kmin; k <= kmax; k++) {
      if (mag[k] > thr && mag[k] > mag[k - 1] && mag[k] >= mag[k + 1]) {
        const a = Math.log(mag[k - 1] + 1e-12), b = Math.log(mag[k] + 1e-12), c = Math.log(mag[k + 1] + 1e-12);
        const den = a - 2 * b + c;
        const d = den !== 0 ? (0.5 * (a - c)) / den : 0;
        cand.push({ f: (k + d) * binHz, m: mag[k] });
      }
    }
    cand.sort((p, q) => q.m - p.m);
    const keep = [];
    for (const p of cand) {
      if (keep.length >= 6) break;
      let harm = false;
      for (const q of keep) {
        for (const r of [3, 5]) { // a third or fifth harmonic is not a melody note
          if (Math.abs(1200 * Math.log2(p.f / (q.f * r))) < 15) harm = true;
        }
      }
      if (!harm) keep.push(p);
    }
    frames.push(keep.map((p) => 1200 * Math.log2(p.f / 440)));
  }
  if (onProgress) onProgress(1);
  // keep partials that persist at the same pitch in a neighbouring frame (tonal, not noise)
  const cents = [], times = [];
  const near = (arr, c) => { for (let i = 0; i < arr.length; i++) if (Math.abs(arr[i] - c) < 30) return true; return false; };
  for (let fr = 0; fr < nFrames; fr++) {
    const t = (fr * hop + N / 2) / fs;
    for (const c of frames[fr]) {
      if ((fr > 0 && near(frames[fr - 1], c)) || (fr + 1 < nFrames && near(frames[fr + 1], c))) { cents.push(c); times.push(t); }
    }
  }
  const M = cents.length;
  if (M < 200) throw new Error('no_pitch');
  const H = new Float64Array(BINS);
  for (let i = 0; i < M; i++) H[Math.floor((((cents[i] % 1200) + 1200) % 1200) / 10) % BINS] += 1 / M;
  const Hfinal = new Float64Array(BINS);
  const tail = Math.min(150, M);
  for (let i = M - tail; i < M; i++) Hfinal[Math.floor((((cents[i] % 1200) + 1200) % 1200) / 10) % BINS] += 1 / tail;
  const S = new Int32Array(M); for (let i = 0; i < M; i++) S[i] = i;
  return {
    H, Hfinal, mode: 'poly',
    track: { cents: Float32Array.from(cents), times: Float64Array.from(times), stableIdx: S, nFrames, hopSec: hop / fs, t0: 0, finalN: 150 },
    stats: { frames: nFrames, stable: M, seconds: n / fs },
  };
}

/* mono tracker first; when the clip is a dense mix and few steady pitches exist, fall back to spectral peaks */
async function analyzeAuto(x, sr, onProgress) {
  let res = null, monoTrack = null;
  try { res = await analyze(x, sr, (p) => onProgress && onProgress(p * 0.5)); monoTrack = res.monoTrack; }
  catch (e) { if (e.message !== 'no_pitch') throw e; monoTrack = e.track || null; }
  const dur = x.length / sr;
  if (res && res.stats.stable / dur >= 6) return res;
  const poly = await analyzePoly(x, sr, (p) => onProgress && onProgress(0.5 + p * 0.5));
  poly.monoTrack = monoTrack;
  return poly;
}


/* ---------- sections: where the sound changes (music / singing) and the melody changes ---------- */
const BAND_HZ = [60, 200, 400, 800, 1600, 3200, 7000];

async function timbreFeatures(x, sr) {
  const f = Math.max(1, Math.round(sr / 16000));
  const fs = sr / f, n = Math.floor(x.length / f);
  const y = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < f; j++) s += x[i * f + j]; y[i] = s / f; }
  const N = 1024, hop = 512, nF = Math.floor((n - N) / hop);
  const per = Math.round((0.5 * fs) / hop), nOut = Math.floor(nF / per);
  if (nOut < 20) return null;
  const win = new Float64Array(N);
  for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (N - 1));
  const binHz = fs / N, edges = BAND_HZ.map((h) => Math.round(h / binHz));
  const fluxLo = edges[0], fluxHi = Math.round(4000 / binHz);
  const re = new Float64Array(N), im = new Float64Array(N);
  let prev = new Float64Array(N / 2);
  const F = new Float32Array(nOut * 8), rms = new Float32Array(nOut), times = new Float64Array(nOut);
  const acc = new Float64Array(8);
  for (let o = 0; o < nOut; o++) {
    acc.fill(0);
    for (let k = 0; k < per; k++) {
      const fr = o * per + k, st = fr * hop;
      let e = 0;
      for (let i = 0; i < N; i++) { re[i] = y[st + i] * win[i]; im[i] = 0; e += y[st + i] * y[st + i]; }
      fftInPlace(re, im);
      const mag = new Float64Array(N / 2);
      for (let b = 0; b < N / 2; b++) mag[b] = Math.sqrt(re[b] * re[b] + im[b] * im[b]);
      for (let bd = 0; bd < 6; bd++) { let t = 0; for (let b = edges[bd]; b < edges[bd + 1]; b++) t += mag[b] * mag[b]; acc[bd] += t; }
      let fx = 0; for (let b = fluxLo; b < fluxHi; b++) { const d = mag[b] - prev[b]; if (d > 0) fx += d; }
      acc[6] += fx; acc[7] += e / N; prev = mag;
    }
    for (let bd = 0; bd < 6; bd++) F[o * 8 + bd] = Math.log(acc[bd] / per + 1e-9);
    F[o * 8 + 6] = Math.log(acc[6] / per + 1e-6);
    F[o * 8 + 7] = Math.log(acc[7] / per + 1e-9);
    rms[o] = Math.sqrt(acc[7] / per);
    times[o] = (o + 0.5) * 0.5;
    if (o % 40 === 0) await tick();
  }
  return { F, rms, times, nOut };
}

/* boundaries where the overall sound changes (Foote novelty on a self-similarity matrix); returns [{t, s}] */
function noveltyBoundaries(feat) {
  const { F, nOut } = feat, D = 8;
  const mu = new Float64Array(D), sd = new Float64Array(D);
  for (let d = 0; d < D; d++) {
    for (let i = 0; i < nOut; i++) mu[d] += F[i * 8 + d] / nOut;
    for (let i = 0; i < nOut; i++) sd[d] += Math.pow(F[i * 8 + d] - mu[d], 2) / nOut;
    sd[d] = Math.sqrt(sd[d]) || 1;
  }
  const Z = new Float32Array(nOut * D);
  for (let i = 0; i < nOut; i++) for (let d = 0; d < D; d++) Z[i * D + d] = (F[i * 8 + d] - mu[d]) / sd[d];
  const sim = (i, j) => {
    let q = 0;
    for (let d = 0; d < D; d++) { const v = Z[i * D + d] - Z[j * D + d]; q += v * v; }
    return Math.exp(-q / (2 * D * 0.5));
  };
  const L = 8, nov = new Float64Array(nOut);
  for (let i = L; i < nOut - L; i++) {
    let v = 0;
    for (let a = 1; a <= L; a++) for (let b = 1; b <= L; b++) {
      const w = Math.exp(-(a * a + b * b) / (2 * (L / 2) * (L / 2)));
      v += w * (sim(i - a, i - b) + sim(i + a - 1, i + b - 1) - sim(i - a, i + b - 1) - sim(i + a - 1, i - b));
    }
    nov[i] = v;
  }
  let m = 0, s2 = 0, c = 0;
  for (let i = L; i < nOut - L; i++) { m += nov[i]; c++; }
  m /= c;
  for (let i = L; i < nOut - L; i++) s2 += Math.pow(nov[i] - m, 2) / c;
  const sdv = Math.sqrt(s2) || 1;
  const out = [];
  for (let i = L; i < nOut - L; i++) {
    const z = (nov[i] - m) / sdv;
    if (z < 1.0) continue;
    let isPeak = true;
    for (let k = -4; k <= 4; k++) if (nov[i + k] > nov[i]) isPeak = false;
    if (isPeak) out.push({ t: feat.times[i], s: z });
  }
  return out;
}

/* per 0.5 s block: how much of the pitch track is voiced, and how much shows singing-like vibrato (4-8 Hz wobble) */
function vibratoBlocks(mono, nOut) {
  if (!mono) return null;
  const { cents, nFrames, hopSec, t0 } = mono;
  const vib = new Uint8Array(nFrames), longRun = new Uint8Array(nFrames), voiced = new Uint8Array(nFrames);
  for (let i = 0; i < nFrames; i++) voiced[i] = Number.isNaN(cents[i]) ? 0 : 1;
  let i = 0;
  while (i < nFrames) {
    if (!voiced[i]) { i++; continue; }
    let j = i + 1;
    while (j < nFrames && voiced[j] && Math.abs(cents[j] - cents[j - 1]) < 100) j++;
    const len = j - i;
    if (len >= 12) {
      const dev = new Float64Array(len);
      for (let k = 0; k < len; k++) {
        let s = 0, c = 0;
        for (let q = Math.max(0, k - 7); q <= Math.min(len - 1, k + 7); q++) { s += cents[i + q]; c++; }
        dev[k] = cents[i + k] - s / c;
      }
      let sd = 0; for (let k = 0; k < len; k++) sd += dev[k] * dev[k];
      sd = Math.sqrt(sd / len);
      let zc = 0; for (let k = 1; k < len; k++) if ((dev[k - 1] < 0) !== (dev[k] < 0)) zc++;
      const hz = zc / (2 * len * hopSec);
      for (let k = i; k < j; k++) longRun[k] = 1;
      if (sd >= 5 && sd <= 150 && hz >= 3.5 && hz <= 8.5) for (let k = i; k < j; k++) vib[k] = 1;
    }
    i = j;
  }
  const blocks = [];
  for (let o = 0; o < nOut; o++) {
    const a = Math.max(0, Math.round(((o * 0.5) - t0) / hopSec)), b = Math.min(nFrames, Math.round((((o + 1) * 0.5) - t0) / hopSec));
    let v = 0, lr = 0, vb = 0;
    for (let k = a; k < b; k++) { v += voiced[k]; lr += longRun[k]; vb += vib[k]; }
    blocks.push({ n: Math.max(1, b - a), voiced: v, longRun: lr, vib: vb });
  }
  return blocks;
}

function tagOf(blocks, a, b) {
  if (!blocks) return 'unknown';
  let n = 0, v = 0, lr = 0, vb = 0;
  for (let o = a; o < b; o++) { n += blocks[o].n; v += blocks[o].voiced; lr += blocks[o].longRun; vb += blocks[o].vib; }
  if (n === 0) return 'unknown';
  const voicedFrac = v / n, vibFrac = lr > 0 ? vb / lr : 0;
  if (voicedFrac < 0.12) return 'music';
  if (vibFrac >= 0.4) return 'voice';
  if (voicedFrac >= 0.3 && vibFrac < 0.15) return 'music';
  return 'unknown';
}

/* where singing-like vibrato switches on or off (smoothed over ~6 s, with hysteresis) */
function voiceIntervals(blocks) {
  if (!blocks) return [];
  const n = blocks.length, sc = new Float64Array(n);
  for (let o = 0; o < n; o++) {
    let lr = 0, vb = 0, vd = 0, nn = 0;
    for (let k = Math.max(0, o - 4); k <= Math.min(n - 1, o + 4); k++) { lr += blocks[k].longRun; vb += blocks[k].vib; vd += blocks[k].voiced; nn += blocks[k].n; }
    sc[o] = nn && vd / nn >= 0.12 ? (lr > 0 ? vb / lr : 0) : 0;
  }
  // on/off with hysteresis, then bridge short gaps and drop short bursts so brief flickers are not boundaries
  let on = sc[0] >= 0.4, startT = on ? 0 : -1;
  const iv = [];
  for (let o = 1; o < n; o++) {
    if (!on && sc[o] >= 0.45) { on = true; startT = o * 0.5; }
    else if (on && sc[o] <= 0.3) { on = false; iv.push([startT, o * 0.5]); }
  }
  if (on) iv.push([startT, n * 0.5]);
  const joined = [];
  for (const v of iv) {
    const p = joined[joined.length - 1];
    if (p && v[0] - p[1] < 8) p[1] = v[1]; else joined.push(v.slice());
  }
  return joined.filter((v) => v[1] - v[0] >= 6);
}

function voiceBoundaries(blocks) {
  const out = [], n = blocks ? blocks.length : 0;
  voiceIntervals(blocks).forEach((v) => {
    if (v[0] > 0) out.push({ t: v[0], s: 1.6 });
    if (v[1] < n * 0.5) out.push({ t: v[1], s: 1.6 });
  });
  return out;
}

/* Joins every kind of change into one list of phrases. Each: {start, end, type, maqam, tonicCents, score}.
   type is 'voice' | 'music' | 'unknown'. */
async function buildSections(x, sr, res, top) {
  const seconds = res.stats.seconds;
  const cands = [];
  let feat = null;
  try { feat = await timbreFeatures(x, sr); } catch (e) { feat = null; }
  if (feat) noveltyBoundaries(feat).forEach((b) => cands.push(b));
  const blocks = feat && res.mode !== 'poly' ? vibratoBlocks(res.monoTrack, feat.nOut) : null;
  const vints = voiceIntervals(blocks);
  voiceBoundaries(blocks).forEach((b) => cands.push(b));
  try { segmentTimeline(res, top).slice(1).forEach((sg) => cands.push({ t: sg.start, s: 1.2 })); } catch (e) { /* no melodic boundaries */ }

  if (typeof process !== 'undefined' && process.env.DEBUG_SECTIONS) console.log('candidates', cands.map((c) => c.t.toFixed(1) + ':' + c.s.toFixed(2)).join(' '));
  // keep the strongest boundary inside every 6 s neighbourhood
  cands.sort((a, b) => a.t - b.t);
  let kept = [];
  for (const c of cands) {
    const p = kept[kept.length - 1];
    if (p && c.t - p.t < 6) { if (c.s > p.s) kept[kept.length - 1] = c; } else kept.push(c);
  }
  const first = res.mode === 'poly' ? res.track.times[0] : res.track.t0 + res.track.stableIdx[0] * res.track.hopSec;
  const lastT = Math.min(seconds, res.mode === 'poly' ? res.track.times[res.track.times.length - 1] : res.track.t0 + res.track.stableIdx[res.track.stableIdx.length - 1] * res.track.hopSec);
  kept = kept.filter((c) => c.t > first + 8 && c.t < lastT - 8);
  // no phrase shorter than 8 s: drop the weaker neighbouring boundary until none is
  for (let guard = 0; guard < 100; guard++) {
    const e = [first].concat(kept.map((c) => c.t), [lastT]);
    let bad = -1;
    for (let i = 0; i + 1 < e.length; i++) if (e[i + 1] - e[i] < 8) { bad = i; break; }
    if (bad < 0 || !kept.length) break;
    const left = bad - 1, right = bad; // boundary indexes in `kept`
    let drop;
    if (left < 0) drop = right; else if (right >= kept.length) drop = left; else drop = kept[left].s <= kept[right].s ? left : right;
    kept.splice(drop, 1);
  }

  const tr = res.track, S = tr.stableIdx, cents = tr.cents;
  const tOf = (k) => (tr.times ? tr.times[S[k]] : tr.t0 + S[k] * tr.hopSec);
  const lb = (t) => { let lo = 0, hi = S.length; while (lo < hi) { const m = (lo + hi) >> 1; if (tOf(m) < t) lo = m + 1; else hi = m; } return lo; };
  const finalN = tr.finalN || 40;
  const anchor = top.tonicCents;
  const unitRel = (c) => Math.round(((((c - anchor) % 1200) + 1200) % 1200) / 50) % 24;
  const describe = (start, end) => {
    const a = lb(start), b = lb(end);
    let maqam = null, tonicCents = null, score = null, key = '';
    if (b - a >= 30) {
      const t0 = rank(histOf(cents, S, a, b, finalN))[0];
      maqam = t0.maqam; tonicCents = t0.tonicCents; score = t0.score;
      const tu = unitRel(tonicCents);
      key = Array.from(new Set(maqam.deg.map((d) => (tu + d) % 24))).sort((p, q) => p - q).join(',');
    }
    const oa = feat ? Math.floor(start / 0.5) : 0, ob = feat ? Math.max(oa + 1, Math.floor(end / 0.5)) : 0;
    let type = tagOf(blocks, oa, Math.min(ob, blocks ? blocks.length : 0));
    if (blocks) {
      let ov = 0;
      vints.forEach((v) => { ov += Math.max(0, Math.min(end, v[1]) - Math.max(start, v[0])); });
      if (ov / Math.max(1, end - start) >= 0.5) type = 'voice';
      else if (type === 'voice' || (type === 'unknown' && vints.length)) type = 'music';
    }
    let vec = null;
    if (b - a >= 30) {
      vec = new Float64Array(24);
      for (let k = a; k < b; k++) vec[unitRel(cents[S[k]])] += 1 / (b - a);
    }
    let fvec = null;
    if (b - a >= 30) {
      const fa = Math.max(a, b - finalN); fvec = new Float64Array(24);
      for (let k = fa; k < b; k++) fvec[unitRel(cents[S[k]])] += 1 / (b - fa);
    }
    return { start, end, type, maqam, tonicCents, score, key, vec, fvec, a, b };
  };

  let edges = [first].concat(kept.map((c) => c.t), [lastT]);
  let segs = [];
  for (let i = 0; i + 1 < edges.length; i++) segs.push(describe(edges[i], edges[i + 1]));
  // an undecided type next to a decided one takes the neighbour's type when it is short
  for (let i = 0; i < segs.length; i++) {
    if (segs[i].type !== 'unknown' || segs[i].end - segs[i].start >= 14) continue;
    const nb = (i > 0 && segs[i - 1].type !== 'unknown') ? segs[i - 1] : (i + 1 < segs.length && segs[i + 1].type !== 'unknown' ? segs[i + 1] : null);
    if (nb) segs[i].type = nb.type;
  }
  // ---- one name for the same melody, everywhere in the piece ----
  const lenOf = (sg) => sg.end - sg.start;
  const cosine = (p, q) => { let d = 0, a2 = 0, b2 = 0; for (let i = 0; i < 24; i++) { d += p[i] * q[i]; a2 += p[i] * p[i]; b2 += q[i] * q[i]; } return a2 && b2 ? d / Math.sqrt(a2 * b2) : 0; };
  // neighbours of the same kind with the same note profile are one phrase
  for (let guard = 0; guard < 200; guard++) {
    let did = false;
    for (let i = 0; i + 1 < segs.length; i++) {
      const p = segs[i], q = segs[i + 1];
      const shortOne = Math.min(lenOf(p), lenOf(q)) < 15;
      const alike = p.vec && q.vec && cosine(p.vec, q.vec) >= 0.95;
      if (res.mode !== 'poly' && p.type === q.type && (alike || shortOne)) {
        const d = describe(p.start, q.end);
        d.type = p.type;
        segs.splice(i, 2, d); did = true; break;
      }
    }
    if (!did) break;
  }
  // ---- name each phrase the way a musician would: keep the piece's tonic, then read the notes that decide the maqam ----
  // vec[u] = share of notes u quarter-tones above the piece's tonic (anchor = top.tonicCents)
  const deciding = (vec) => {
    const pick = (opts) => {
      const ms = opts.map((u) => vec[u % 24]);
      let bi = 0; for (let i = 1; i < ms.length; i++) if (ms[i] > ms[bi]) bi = i;
      const sorted = ms.slice().sort((p, q) => q - p);
      return { u: opts[bi], mass: ms[bi], second: sorted[1] || 0, alt: opts[ms.indexOf(sorted[1])] };
    };
    const d3 = pick([6, 7, 8]);
    return { d2: pick([2, 3, 4]), d3, d4: pick(d3.u === 8 ? [10, 12] : [8, 10, 12]) };
  };
  const templateAt = (vec, m) => {
    // how well a maqam on the piece's tonic explains these notes: notes it uses minus notes it does not
    let inside = 0, pres = 0;
    const set = new Set(m.deg);
    m.deg.forEach((d) => { inside += vec[d % 24]; pres += Math.min(1, vec[d % 24] / 0.02); });
    // small amounts outside the scale are usually overtones of strong notes or passing slides, not part of the maqam
    let outside = 0; for (let u = 0; u < 24; u++) if (!set.has(u)) outside += Math.max(0, vec[u] - 0.025);
    return inside - 1.5 * outside + 0.15 * (pres / m.deg.length);
  };
  const nameAtTonic = (vec) => {
    const d = deciding(vec);
    const ok2 = d.d2.mass >= 0.015, ok3 = d.d3.mass >= 0.015, ok4 = d.d4.mass >= 0.03 && d.d4.mass >= 1.5 * d.d4.second;
    let cands = MAQAMAT.filter((m) => (!ok2 || m.deg[1] === d.d2.u) && (!ok3 || m.deg[2] === d.d3.u) && (!ok4 || m.deg[3] === d.d4.u));
    if (!cands.length) cands = MAQAMAT.filter((m) => (!ok2 || m.deg[1] === d.d2.u) && (!ok3 || m.deg[2] === d.d3.u));
    if (!cands.length) cands = MAQAMAT.slice();
    cands.sort((p, q) => templateAt(vec, q) - templateAt(vec, p));
    const chosen = cands[0];
    // the deciding note is a near tie: say which other maqam it could be
    let alt = null;
    if (ok2 && d.d2.second >= 0.6 * d.d2.mass && d.d2.second >= 0.012) {
      const other = MAQAMAT.filter((m) => m.deg[1] === d.d2.alt && m.deg[2] === chosen.deg[2]).sort((p, q) => templateAt(vec, q) - templateAt(vec, p))[0];
      if (other && other.id !== chosen.id) alt = other;
    }
    return { maqam: chosen, fit: templateAt(vec, chosen), alt, unsure: !ok2 || !ok3 };
  };
  const shiftVec = (vec, k) => { const o = new Float64Array(24); for (let u = 0; u < 24; u++) o[u] = vec[(u + k) % 24]; return o; };
  const chooseTonic = (vec, fvec, kHome) => {
    const opts = [];
    for (let k = 0; k < 24; k++) {
      if (vec[k] < 0.06) continue;
      const n = nameAtTonic(shiftVec(vec, k));
      opts.push({ k, n, fit: n.fit - (n.unsure ? 0.1 : 0) });
    }
    if (!opts.length) return null;
    const bestFit = Math.max.apply(null, opts.map((o) => o.fit));
    // same notes can be read from several tonics (nahawand on C = kurd on G): pick the note the music leans on and ends on
    const near = opts.filter((o) => o.fit >= bestFit - 0.04);
    near.forEach((o) => { o.sal = vec[o.k] + 0.6 * (fvec ? fvec[o.k] : 0) + (o.k === kHome ? 0.06 : 0) + 2 * (o.fit - bestFit); });
    near.sort((p, q) => q.sal - p.sal);
    return near[0];
  };
  // the piece's own tonic, from all of its notes
  const whole = describe(segs[0].start, segs[segs.length - 1].end);
  const homeChoice = whole.vec ? chooseTonic(whole.vec, whole.fvec, -1) : null;
  const kHome = homeChoice ? homeChoice.k : 0;
  if (typeof process !== 'undefined' && process.env.DEBUG_SECTIONS) console.log('kHome', kHome, 'anchor', anchor.toFixed(0), homeChoice && homeChoice.n.maqam.id);
  const nameSection = (sg) => {
    if (!sg.vec) return null;
    const v = sg.vec, f = sg.fvec || new Float64Array(24);
    const homeN = nameAtTonic(shiftVec(v, kHome));
    let pickK = kHome, pickN = homeN;
    if (!homeN.unsure) {
      // move to another tonic only when it explains the notes clearly better,
      // or explains them as well and the melody clearly rests on it
      const homeSal = v[kHome] + f[kHome];
      let bestScore = 0;
      for (let k = 0; k < 24; k++) {
        if (k === kHome || v[k] < 0.06) continue;
        const n = nameAtTonic(shiftVec(v, k));
        if (n.unsure) continue;
        const sal = v[k] + f[k];
        const better = n.fit > homeN.fit + 0.04 || (n.fit >= homeN.fit - 0.01 && sal > homeSal + 0.05);
        if (!better) continue;
        const sc = (n.fit - homeN.fit) + (sal - homeSal);
        if (sc > bestScore) { bestScore = sc; pickK = k; pickN = n; }
      }
    }
    const tonicCents = anchor + pickK * 50;
    if (typeof process !== 'undefined' && process.env.DEBUG_SECTIONS) console.log('sec', sg.start.toFixed(0), 'home', homeN.maqam.id, homeN.unsure ? 'UNSURE' : '', homeN.fit.toFixed(3), '-> k', pickK, pickN.maqam.id, pickN.fit.toFixed(3), 'vec[home]', v[kHome].toFixed(2));
    return { maqam: pickN.maqam, tonicCents, score: Math.max(0, pickN.fit), alt: pickN.alt ? { maqam: pickN.alt, tonicCents } : null, unsure: pickN.unsure };
  };
  segs.forEach((sg) => {
    const nm = nameSection(sg);
    if (nm) { sg.maqam = nm.maqam; sg.tonicCents = nm.tonicCents; sg.score = nm.score; sg.alt = nm.alt; sg.unsure = nm.unsure; }
    else { sg.maqam = null; }
  });
  // a phrase too thin to decide (the deciding notes are missing) takes its neighbour's name
  for (let i = 0; i < segs.length; i++) {
    if (!segs[i].unsure) continue;
    const nb = [segs[i - 1], segs[i + 1]].filter((x) => x && x.maqam && !x.unsure).sort((p, q) => lenOf(q) - lenOf(p))[0];
    if (nb && centsDist(nb.tonicCents, segs[i].tonicCents) < 35) { segs[i].maqam = nb.maqam; segs[i].alt = nb.alt; segs[i].score = nb.score; }
  }
  const groupKey = (sg) => sg.maqam ? sg.maqam.id + '@' + Math.round(sg.tonicCents / 50) + (sg.alt ? '|' + sg.alt.maqam.id : '') : '';
  segs.forEach((sg) => { sg.group = groupKey(sg); });
  // after naming, neighbours that ended up with the same name and kind are one phrase
  for (let guard = 0; guard < 100; guard++) {
    let did = false;
    for (let i = 0; i + 1 < segs.length; i++) {
      const p = segs[i], q = segs[i + 1];
      if (p.maqam && q.maqam && p.type === q.type && p.group === q.group) { segs.splice(i, 2, Object.assign({}, lenOf(p) >= lenOf(q) ? p : q, { start: p.start, end: q.end })); did = true; break; }
    }
    if (!did) break;
  }
  const cover = {}, rep = {};
  segs.forEach((sg) => { if (sg.maqam) { cover[sg.group] = (cover[sg.group] || 0) + lenOf(sg); if (!rep[sg.group] || lenOf(sg) > lenOf(rep[sg.group])) rep[sg.group] = sg; } });
  let dom = null;
  Object.keys(cover).forEach((k) => { if (dom === null || cover[k] > cover[dom]) dom = k; });
  const out = segs.map((sg) => ({ start: sg.start, end: sg.end, type: sg.type, maqam: sg.maqam || null, tonicCents: sg.maqam ? sg.tonicCents : null, score: sg.maqam ? sg.score : null, alt: sg.alt || null, group: sg.group || '' }));
  const dg = dom === null ? null : rep[dom];
  out.dominant = dg ? { maqam: dg.maqam, tonicCents: dg.tonicCents, score: dg.score, alt: dg.alt } : null;
  return out;
}

/* ---------- synthetic singer, used for demos and for testing ---------- */
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function synthMelody(deg, f0, sr, seed, opts) {
  opts = opts || {};
  const VIB = opts.vib == null ? 12 : opts.vib, GLIDE = opts.glide || 0.03, NOISE = opts.noise == null ? 0.004 : opts.noise, VRATE = opts.vrate || 5.5;
  const r = rng(seed);
  const n = deg.length;
  const unit = (k) => { const o = Math.floor(k / n); const m = ((k % n) + n) % n; return deg[m] + 24 * o; };
  const seq = [];
  const push = (k, dur) => seq.push([unit(k), dur]);
  let k = 0;
  push(0, 0.9);
  for (let i = 0; i < 50; i++) {
    const p = r();
    const st = p < 0.25 ? -1 : p < 0.5 ? 1 : p < 0.65 ? -2 : p < 0.8 ? 2 : p < 0.9 ? 0 : (r() < 0.5 ? 3 : -3);
    k += st;
    if (k > n + 1) k -= 3;
    if (k < -2) k += 3;
    push(k, 0.3 + r() * 0.5);
  }
  for (let j = 0; j <= n; j++) push(j, 0.4);
  for (let j = n - 1; j >= 0; j--) push(j, 0.35);
  push(0, 1.8);

  let totalDur = 0;
  for (const s of seq) totalDur += s[1] + 0.03;
  const out = new Float32Array(Math.ceil(totalDur * sr) + 16);
  const H = [1, 0.5, 0.33, 0.22, 0.15];
  let pos = 0, ph = 0, lf = Math.log2(f0), vph = 0;
  const a = 1 - Math.exp(-1 / (GLIDE * sr));
  for (const [u, dur] of seq) {
    const target = Math.log2(f0) + (u * 50 + (r() - 0.5) * 24) / 1200;
    const ns = Math.floor(dur * sr);
    for (let i = 0; i < ns; i++) {
      lf += (target - lf) * a;
      vph += (2 * Math.PI * VRATE) / sr;
      const vib = ((dur > 0.6 ? VIB : VIB * 0.4) / 1200) * Math.sin(vph);
      ph += (2 * Math.PI * Math.pow(2, lf + vib)) / sr;
      let amp = 1;
      const t = i / sr;
      if (t < 0.015) amp = t / 0.015;
      const rem = (ns - i) / sr;
      if (rem < 0.04) amp = Math.min(amp, rem / 0.04);
      let s = 0;
      for (let h = 0; h < H.length; h++) s += H[h] * Math.sin((h + 1) * ph);
      out[pos + i] = 0.25 * amp * s + (r() - 0.5) * NOISE;
    }
    pos += ns + Math.floor(0.03 * sr);
  }
  return out;
}

if (typeof module !== 'undefined') {
  module.exports = { MAQAMAT, BINS, analyze, analyzePoly, analyzeAuto, rank, segmentTimeline, buildSections, vibratoBlocks, voiceBoundaries, synthMelody, noteFromCents, stepsOf, fracTone, unitName };
}

</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var btn = $('rec'), lab = $('recLabel'), statusEl = $('status'), out = $('out');
  var AC = window.AudioContext || window.webkitAudioContext;
  var cap = null, busy = false, last = null, player = null;

  function fmt(s) { var m = Math.floor(s / 60), x = Math.floor(s % 60); return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x; }
  function setStatus(html) { statusEl.innerHTML = html; }
  function error(msg) { out.innerHTML = '<p class="err"></p>'; out.firstChild.textContent = msg; }

  function show(r) {
    last = r;
    out.innerHTML = '<div class="result"><p class="label">المقام</p><div class="name" id="nm"></div><p class="tonic" id="tn"></p>' +
      (r.also ? '<p class="also" id="al"></p>' : '') + '<button class="small" id="play" type="button">▶ اسمع سلّم المقام</button></div>';
    $('nm').textContent = r.maqam.ar;
    $('tn').textContent = 'القرار: ' + noteFromCents(r.tonicCents).name;
    if (r.also) $('al').textContent = 'وقريب أيضًا من ' + r.also;
    $('play').addEventListener('click', playScale);
  }

  function playScale() {
    if (!last || !AC) return;
    try { player = player || new AC(); if (player.resume) player.resume(); } catch (e) { return; }
    var f = 440 * Math.pow(2, last.tonicCents / 1200);
    while (f < 150) f *= 2; while (f > 300) f /= 2;
    var degs = last.maqam.deg.concat([24]), t0 = player.currentTime + 0.05, st = 0.45;
    degs.forEach(function (u, i) {
      var o = player.createOscillator(), g = player.createGain(), s = t0 + i * st;
      o.type = 'triangle'; o.frequency.value = f * Math.pow(2, u * 50 / 1200);
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.28, s + 0.03); g.gain.exponentialRampToValueAtTime(0.001, s + st * 0.95);
      o.connect(g); g.connect(player.destination); o.start(s); o.stop(s + st);
    });
  }

  // one answer for the whole recording: the maqam that covers most of it, on a steady tonic
  function decide(data, sr) {
    return analyzeAuto(data, sr, function (p) { setStatus('نحلّل… ' + Math.round(p * 100) + '%'); }).then(function (res) {
      var top = rank(res)[0];
      return buildSections(data, sr, res, top).then(function (secs) {
        var d = secs && secs.dominant;
        if (d && d.maqam) return { maqam: d.maqam, tonicCents: d.tonicCents, also: d.alt ? d.alt.maqam.ar : null };
        return { maqam: top.maqam, tonicCents: top.tonicCents, also: null };
      }, function () { return { maqam: top.maqam, tonicCents: top.tonicCents, also: null }; });
    });
  }

  function run(data, sr) {
    busy = true; btn.disabled = true; out.innerHTML = '';
    setStatus('نحلّل…');
    decide(data, sr).then(function (r) { setStatus(''); show(r); }).catch(function (e) {
      setStatus('');
      if (e && e.message === 'no_pitch') error('لم أسمع نغمات واضحة. غنِّ أقرب للموبايل وبصوت أعلى، 20 ثانية على الأقل.');
      else if (e && e.message === 'too_short') error('التسجيل قصير. غنِّ 15 ثانية على الأقل.');
      else error('حدث خطأ أثناء التحليل. جرّب مرة ثانية.');
    }).then(function () { busy = false; btn.disabled = false; lab.textContent = 'سجّل'; });
  }

  function stop() {
    var c = cap; cap = null;
    clearInterval(c.timer);
    try { c.proc.disconnect(); c.src.disconnect(); } catch (e) {}
    c.stream.getTracks().forEach(function (t) { t.stop(); });
    var sr = c.ctx.sampleRate; try { c.ctx.close(); } catch (e) {}
    btn.classList.remove('on'); lab.textContent = 'سجّل';
    var n = 0; c.bufs.forEach(function (b) { n += b.length; });
    if (n < sr * 8) { setStatus(''); error('التسجيل قصير. غنِّ 15 ثانية على الأقل.'); return; }
    if (c.peak < 0.01) { setStatus(''); error('التسجيل صامت تقريبًا. تأكد إن المايك شغال وغنِّ أقرب للموبايل.'); return; }
    var data = new Float32Array(n), pos = 0;
    c.bufs.forEach(function (b) { data.set(b, pos); pos += b.length; });
    run(data, sr);
  }

  function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AC) {
      error('المتصفح ده مش بيسمح بالمايك. افتح التطبيق من Chrome، أو اختر ملفًا صوتيًا من تحت.');
      return;
    }
    out.innerHTML = '';
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (stream) {
      var ctx = new AC(); if (ctx.resume) ctx.resume();
      var src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1), mute = ctx.createGain();
      mute.gain.value = 0;
      var c = { ctx: ctx, src: src, proc: proc, stream: stream, bufs: [], peak: 0, level: 0, timer: null, t0: Date.now() };
      proc.onaudioprocess = function (e) {
        var d = e.inputBuffer.getChannelData(0), m = 0;
        for (var i = 0; i < d.length; i++) { var v = d[i] < 0 ? -d[i] : d[i]; if (v > m) m = v; }
        c.bufs.push(new Float32Array(d)); c.level = m; if (m > c.peak) c.peak = m;
      };
      src.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
      cap = c;
      btn.classList.add('on'); lab.textContent = 'إيقاف';
      setStatus('<span class="time" id="tm">00:00</span><span class="meter"><i id="lv"></i></span><span id="hint">جاري التسجيل…</span>');
      c.timer = setInterval(function () {
        var s = (Date.now() - c.t0) / 1000;
        $('tm').textContent = fmt(s);
        $('lv').style.width = Math.min(100, Math.round(c.level * 300)) + '%';
        $('hint').textContent = c.level < 0.01 ? 'الصوت ضعيف، قرّب الموبايل' : (s < 15 ? 'كمّل غُنا…' : 'تمام، اضغط إيقاف لما تخلص');
        if (s >= 90) stop();
      }, 200);
    }).catch(function () {
      error('محتاج إذن المايك. من قائمة Chrome ⋮ ← الإعدادات ← إعدادات المواقع ← الميكروفون، اسمح للموقع وجرّب تاني.');
    });
  }

  btn.addEventListener('click', function () { if (busy) return; if (cap) stop(); else start(); });

  $('file').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f || busy || !AC) return;
    busy = true; btn.disabled = true; out.innerHTML = ''; setStatus('نقرأ الملف…');
    f.arrayBuffer().then(function (buf) {
      var ac = new AC();
      return new Promise(function (ok, bad) { ac.decodeAudioData(buf, ok, bad); }).then(function (a) { try { ac.close(); } catch (x) {} return a; });
    }).then(function (a) {
      var len = Math.min(a.length, Math.floor(360 * a.sampleRate)), d = new Float32Array(len);
      for (var ch = 0; ch < a.numberOfChannels; ch++) { var s = a.getChannelData(ch); for (var i = 0; i < len; i++) d[i] += s[i] / a.numberOfChannels; }
      busy = false; run(d, a.sampleRate);
    }).catch(function () { busy = false; btn.disabled = false; setStatus(''); error('مش قادر أقرا الملف ده. جرّب mp3 أو m4a أو wav.'); });
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
